name: Verify release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore core tests in locked mode
        run: dotnet restore tests/PulseQueue.Core.SelfTest/PulseQueue.Core.SelfTest.csproj --locked-mode
      - name: Compile core test harness
        run: dotnet build tests/PulseQueue.Core.SelfTest/PulseQueue.Core.SelfTest.csproj -c Release --no-restore
      - name: Test one-shot and Turbo invariants
        run: dotnet run --project tests/PulseQueue.Core.SelfTest/PulseQueue.Core.SelfTest.csproj -c Release --no-build --no-restore
      - name: Verify core and test formatting
        run: |
          dotnet format src/PulseQueue.Core/PulseQueue.Core.csproj --verify-no-changes --no-restore
          dotnet format tests/PulseQueue.Core.SelfTest/PulseQueue.Core.SelfTest.csproj --verify-no-changes --no-restore
      - name: Check native safety contract
        shell: pwsh
        run: ./scripts/Verify-SafetyContract.ps1
      - name: Verify published package
        shell: pwsh
        run: ./scripts/Verify-Release.ps1
